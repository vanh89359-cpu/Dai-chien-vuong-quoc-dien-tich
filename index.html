<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại chiến Vương quốc Diện tích V4</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#101f38,#245d7b);color:#fff}
.wrap{max-width:920px;margin:auto;padding:18px}.hero{text-align:center}.hero h1{font-size:30px}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.stat{background:#ffffff18;padding:9px 15px;border-radius:12px}
.map{display:flex;gap:7px;overflow:auto;margin:15px 0}.gate{min-width:90px;background:#fff;color:#16324a;border-radius:13px;padding:9px;text-align:center;opacity:.35}.active{opacity:1;outline:3px solid #ffd166}.done{opacity:1;background:#cdf3d4}
.card{background:#ffffff12;border:1px solid #ffffff25;border-radius:22px;padding:24px}.title{font-size:23px;font-weight:900}.q{font-size:19px;line-height:1.55;margin:14px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer,.btn{padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}.answer{background:#f7f9fc;color:#16324a}.good{background:#b8edc1!important}.bad{background:#ffb7b7!important}.feedback{min-height:42px;margin:13px 0;font-weight:bold}.center{text-align:center}.big{font-size:65px}.btn{background:#ffd166;color:#14283a}.scroll{max-height:430px;overflow:auto}
@media(max-width:620px){.answers{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head>
<body><div class="wrap">
<div class="hero"><h1>🏰 ĐẠI CHIẾN VƯƠNG QUỐC DIỆN TÍCH</h1><p>Không gợi ý. Không bật mí công thức. Tự khám phá và tính!</p></div>
<div class="stats"><div class="stat">❤️ <b id="life">3</b></div><div class="stat">⭐ <b id="score">0</b> XP</div><div class="stat">💰 <b id="coin">0</b></div></div>
<div class="map" id="map"></div><div class="card" id="game"></div>
</div>
<script>
const gates=[["🔺","Tam giác"],["⚡","Vuông"],["⚔️","SIN"],["🧙","Heron"],["◇","Hình thoi"],["▱","Hình thang"],["▭","Chữ nhật"],["👹","BOSS"]];
let level=0,life=3,score=0,coin=0,step=0,boss=0;
const $=id=>document.getElementById(id);
function update(){$("life").textContent=life;$("score").textContent=score;$("coin").textContent=coin;$("map").innerHTML=gates.map((g,i)=>`<div class="gate ${i===level?"active":""} ${i<level?"done":""}">${g[0]}<br><b>${g[1]}</b></div>`).join("")}
function lose(){life--;update();if(life<=0){$("game").innerHTML='<div class="center"><div class="big">💥</div><h2>Hết mạng!</h2><button class="btn" onclick="location.reload()">🔄 Chơi lại</button>';return true}return false}
function next(){level++;step=0;update();render()}
function answer(el,correct,txt){if(correct){el.classList.add("good");score+=20;coin+=10;$("feedback").textContent=txt;setTimeout(next,600)}else{el.classList.add("bad");$("feedback").textContent="💔 Chưa đúng! Mất 1 mạng.";lose()}}
function mc(title,q,arr,c,pts=20){$("game").innerHTML=`<div class="title">${title}</div><div class="q">${q}</div><div class="answers">${arr.map((x,i)=>`<button class="answer" onclick="answer(this,${i===c},'✨ Chính xác!')">${x}</button>`).join("")}</div><div id="feedback" class="feedback"></div>`}
const sin=[
["⚔️ VÙNG 3 — SIN 1/4","Hai cạnh 6 cm và 8 cm, góc xen giữa 30°. Diện tích bằng bao nhiêu?",["12 cm²","24 cm²","48 cm²","14 cm²"],0],
["⚔️ VÙNG 3 — SIN 2/4","AB=10 cm, AC=12 cm, góc A=60°. Cách nào phù hợp nhất?",["Dùng Heron","Dùng đáy–cao","Dùng công thức SIN","Dùng công thức hình thoi"],2],
["⚔️ VÙNG 3 — SIN 3/4","Hai cạnh 5 cm, 7 cm, góc xen giữa 90°. Diện tích bằng bao nhiêu?",["17,5 cm²","35 cm²","12 cm²","10 cm²"],0],
["⚔️ VÙNG 3 — SIN 4/4","Cho a=8,b=5,C=30°. Diện tích tam giác bằng bao nhiêu?",["10 cm²","20 cm²","40 cm²","5 cm²"],0]
];
const heron=[
["🧙 VÙNG 4 — HERON 1/4","Tam giác có ba cạnh 5 cm, 6 cm, 7 cm. Công thức nào thích hợp nhất?",["Đáy–cao","SIN","HERON","Hình thang"],2],
["🧙 VÙNG 4 — HERON 2/4","Với ba cạnh 5 cm, 6 cm, 7 cm, nửa chu vi bằng bao nhiêu?",["6","9","18","3"],1],
["🧙 VÙNG 4 — HERON 3/4","Với p=9, a=5,b=6,c=7, diện tích tam giác bằng bao nhiêu?",["6√6 cm²","12√6 cm²","18√6 cm²","3√6 cm²"],0],
["🧙 VÙNG 4 — HERON 4/4","Tam giác có ba cạnh 13,14,15. Diện tích bằng bao nhiêu?",["84","42","96","72"],0]
];
const rhombus=[
["◇ VÙNG 5 — HÌNH THOI 1/2","Hình thoi có hai đường chéo 6 cm và 10 cm. Diện tích bằng bao nhiêu?",["16 cm²","30 cm²","60 cm²","36 cm²"],1],
["◇ VÙNG 5 — HÌNH THOI 2/2","Hình thoi có cạnh 8 cm và chiều cao 5 cm. Diện tích bằng bao nhiêu?",["13 cm²","20 cm²","40 cm²","80 cm²"],2]
];
const trapezoid=[
["▱ VÙNG 6 — HÌNH THANG 1/2","Hình thang có hai đáy 7 cm, 13 cm và chiều cao 4 cm. Diện tích?",["20 cm²","30 cm²","40 cm²","80 cm²"],2],
["▱ VÙNG 6 — HÌNH THANG 2/2","Hai đáy 5 cm, 9 cm; chiều cao 6 cm. Diện tích?",["42 cm²","84 cm²","30 cm²","24 cm²"],0]
];
const rect=[
["▭ VÙNG 7 — HÌNH CHỮ NHẬT 1/2","Hình chữ nhật dài 12 cm, rộng 5 cm. Diện tích?",["17 cm²","30 cm²","60 cm²","120 cm²"],2],
["▭ VÙNG 7 — HÌNH CHỮ NHẬT 2/2","Hình chữ nhật dài 9 cm, rộng 4 cm. Diện tích?",["13 cm²","18 cm²","36 cm²","72 cm²"],2]
];
function sequence(data){let q=data[step];$("game").innerHTML=`<div class="title">${q[0]}</div><div class="q">${q[1]}</div><div class="answers">${q[2].map((x,i)=>`<button class="answer" onclick="seq(this,${i},${q[3]})">${x}</button>`).join("")}</div><div id="feedback" class="feedback"></div>`}
function seq(el,i,c){if(i===c){el.classList.add("good");score+=30;coin+=15;$("feedback").textContent="✨ Chính xác!";step++;setTimeout(()=>{if(level===2&&step<sin.length)sequence(sin);else if(level===3&&step<heron.length)sequence(heron);else if(level===4&&step<rhombus.length)sequence(rhombus);else if(level===5&&step<trapezoid.length)sequence(trapezoid);else if(level===6&&step<rect.length)sequence(rect);else next()},550)}else{el.classList.add("bad");$("feedback").textContent="💥 Sai! Mất 1 mạng.";lose()}}
function bossGate(){$("game").innerHTML=`<div class="title">👹 BOSS CUỐI — 8 LỚP GIÁP</div><div class="q">Mỗi tình huống là một lớp giáp. Hãy chọn <b>đáp án đúng</b>. Không có gợi ý!</div><div class="answers">
<button class="answer" onclick="hit(this)">🔺 Đáy 12, cao 7 → 42 cm²</button>
<button class="answer" onclick="hit(this)">⚡ Vuông, 6 và 8 → 24 cm²</button>
<button class="answer" onclick="hit(this)">⚔️ 6,8,30° → 12 cm²</button>
<button class="answer" onclick="hit(this)">🧙 5,6,7 → 6√6 cm²</button>
<button class="answer" onclick="hit(this)">◇ d₁=6,d₂=10 → 30 cm²</button>
<button class="answer" onclick="hit(this)">▱ đáy 7,13,h=4 → 40 cm²</button>
<button class="answer" onclick="hit(this)">▭ 12×5 → 60 cm²</button>
<button class="answer" onclick="hit(this)">⚔️ 8,5,30° → 10 cm²</button>
</div><div id="feedback" class="feedback"></div>`}
function hit(el){if(el.dataset.hit)return;el.dataset.hit=1;el.classList.add("good");boss++;score+=35;coin+=20;$("feedback").textContent="💥 Phá giáp "+boss+"/8!";if(boss===8)setTimeout(win,600)}
function win(){$("game").innerHTML=`<div class="center"><div class="big">👑🎉</div><h2>CHINH PHỤC VƯƠNG QUỐC!</h2><p>Cuộn bí kíp chỉ mở sau khi thắng.</p><button class="btn" onclick="scrollToFormula()">📜 Mở cuộn bí kíp</button><div id="scroll" style="display:none;margin-top:18px"><div class="q"><b>📜 BÍ KÍP DIỆN TÍCH</b></div><div class="formula">🔺 Tam giác: S=½ah<br>⚡ Tam giác vuông: S=½ab (a,b là hai cạnh góc vuông)<br>⚔️ Tam giác: S=½ab·sinC<br>🧙 Heron: p=(a+b+c)/2; S=√[p(p-a)(p-b)(p-c)]<br>◇ Hình thoi: S=d₁d₂/2 hoặc S=a·h<br>▱ Hình thang: S=(a+b)h/2<br>▭ Hình chữ nhật: S=a·b</div></div><h2>⭐ ${score} XP &nbsp; 💰 ${coin} xu</h2><p>🏆 <b>ĐẠI PHÁP SƯ DIỆN TÍCH</b></p><button class="btn" onclick="location.reload()">🔄 Chơi lại</button></div>`}
function scrollToFormula(){$("scroll").style.display="block"}
function render(){update();if(level===0)mc("🔺 VÙNG 1 — TAM GIÁC CƠ BẢN","Tam giác có đáy 12 cm và chiều cao 7 cm. Diện tích bằng bao nhiêu?",["42 cm²","84 cm²","19 cm²","38 cm²"],0);else if(level===1)mc("⚡ VÙNG 2 — TAM GIÁC VUÔNG","Tam giác ABC vuông tại A, AB=6 cm, AC=8 cm. Diện tích bằng bao nhiêu?",["14 cm²","24 cm²","48 cm²","28 cm²"],1);else if(level===2)sequence(sin);else if(level===3)sequence(heron);else if(level===4)sequence(rhombus);else if(level===5)sequence(trapezoid);else if(level===6)sequence(rect);else bossGate()}
render();
</script></body></html>
